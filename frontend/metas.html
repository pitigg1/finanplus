<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metas de ahorro - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Metas de ahorro</h1>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nueva meta</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control" maxlength="120" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Descripción</label>
            <input id="descripcion" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Monto objetivo</label>
            <div class="input-group"><span class="input-group-text">$</span><input id="objetivo" type="text" inputmode="numeric" class="form-control monto" placeholder="0" required></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Fecha objetivo</label>
            <input id="fechaObjetivo" type="date" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Prioridad</label>
            <select id="prioridad" class="form-select">
              <option>MEDIA</option>
              <option>ALTA</option>
              <option>BAJA</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Estado</label>
            <select id="estado" class="form-select">
              <option>ACTIVA</option>
              <option>COMPLETADA</option>
              <option>CANCELADA</option>
            </select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Meta</th><th class="text-end">Ahorrado</th><th class="text-end">Objetivo</th><th style="width:180px">Progreso</th><th>Fecha</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>

    <!-- Aportes de la meta elegida (tabla Aportes_Meta) -->
    <div class="card" id="cajaAportes" hidden>
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloAportes">Aportes</h2>
        <form id="formAporte" class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Monto</label>
            <div class="input-group"><span class="input-group-text">$</span><input id="aporteMonto" type="text" inputmode="numeric" class="form-control monto" placeholder="0" required></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Categoría (de ahorro)</label>
            <select id="aporteCategoria" class="form-select" required></select>
            <div id="avisoAhorro" class="form-text"></div>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-success">Agregar aporte</button>
          </div>
        </form>
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>Fecha</th><th class="text-end">Monto</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tablaAportes"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/metas.js"></script>
</body>
</html>
