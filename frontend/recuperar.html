<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recuperar contraseña - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link href="css/apple.css?v=20261030d" rel="stylesheet">
  <script src="js/tema.js?v=20261030d"></script>
  <link href="css/vistas.css?v=20261030d" rel="stylesheet">
  <link href="css/ios.css?v=20261030d" rel="stylesheet">
</head>
<body>
  <button class="btn-tema btn-tema-flotante" type="button" onclick="alternarTema()" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
    <i class="bi bi-moon-stars i-luna"></i><i class="bi bi-sun i-sol"></i>
  </button>
  <main class="container py-4">
    <div class="login-wrap">
      <div class="text-center mb-4">
        <div class="login-logo"><i class="bi bi-key"></i></div>
        <h1 class="mb-1">¿Olvidaste tu contraseña?</h1>
        <p class="text-muted mb-0">Escribe tu correo y te enviaremos un enlace para elegir una nueva.</p>
      </div>

      <div id="alerta"></div>

      <div class="card">
        <div class="card-body p-4">
          <form id="formRecuperar" class="row g-3">
            <div class="col-12">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input id="correo" type="email" class="form-control" placeholder="correo@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="col-12 pt-2">
              <button type="submit" id="btnEnviar" class="btn btn-primary w-100">Enviar enlace</button>
            </div>
          </form>

          <div id="exito" class="text-center d-none">
            <div class="fs-1 text-success mb-2"><i class="bi bi-envelope-check"></i></div>
            <h2 class="h5 mb-2">Revisa tu correo</h2>
            <p class="text-muted mb-0" id="textoExito"></p>
            <p class="small text-muted mt-3 mb-0">Si no te llega, mira la carpeta de spam. Puedes pedir otro enlace en un minuto.</p>
          </div>
        </div>
      </div>

      <p class="text-center mt-4"><a href="login.html">Volver a iniciar sesión</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js?v=20261030d"></script>
  <script src="js/recuperar.js?v=20261030d"></script>
</body>
</html>
