<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Métricas - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <h1 class="h3 mb-0">Métricas financieras</h1>
      <button class="btn btn-primary" onclick="calcular()">Calcular ahora</button>
    </div>
    <p class="text-muted">Resumen calculado por el sistema a partir de tus movimientos.</p>
    <div id="alerta"></div>

    <div class="card">
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Fecha de cálculo</th><th class="text-end">Ingresos</th><th class="text-end">Gastos</th><th class="text-end">Flujo neto</th><th class="text-end">Tasa de ahorro</th><th class="text-end">Score</th><th>Riesgo</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/metricas.js"></script>
</body>
</html>
