<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presupuestos - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Presupuestos</h1>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nuevo presupuesto</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Categoría (de gasto)</label>
            <select id="categoria" class="form-select" required></select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Mes</label>
            <input id="mes" type="number" min="1" max="12" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Año</label>
            <input id="anio" type="number" min="2000" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Límite</label>
            <div class="input-group"><span class="input-group-text">$</span><input id="limite" type="text" inputmode="numeric" class="form-control monto" placeholder="0" required></div>
          </div>
          <div class="col-12">
            <small class="text-muted">Lo gastado se calcula solo: es la suma de tus registros de tipo GASTO en esa categoría durante ese mes.</small>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Categoría</th><th>Mes/Año</th><th class="text-end">Límite</th><th class="text-end">Gastado</th><th style="width:200px">Progreso</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/presupuestos.js"></script>
</body>
</html>
