<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Usuarios</h1>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nuevo usuario</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Correo</label>
            <input id="correo" type="email" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Contraseña <small class="text-muted">(vacía = no cambiar)</small></label>
            <input id="password" type="password" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Moneda</label>
            <input id="moneda" class="form-control" value="COP">
          </div>
          <div class="col-md-4">
            <label class="form-label">País</label>
            <input id="pais" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Estado</label>
            <select id="estado" class="form-select">
              <option>ACTIVO</option>
              <option>INACTIVO</option>
              <option>SUSPENDIDO</option>
            </select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Nombre</th><th>Correo</th><th>País</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
