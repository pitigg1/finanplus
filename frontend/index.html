<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-1">Bienvenido a FinanPlus</h1>
    <p class="text-muted">App de finanzas personales</p>
    <div id="alerta"></div>

    <div class="row g-4">
      <!-- Elegir usuario -->
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">1. Elige tu usuario</h2>
            <p class="text-muted small">Todas las páginas trabajan con el usuario que elijas aquí.</p>
            <select id="usuarioSel" class="form-select"></select>
          </div>
        </div>
      </div>

      <!-- Crear usuario -->
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">¿No tienes usuario? Crea uno</h2>
            <form id="formulario" class="row g-2">
              <div class="col-12"><input id="nombre" class="form-control" placeholder="Nombre" required></div>
              <div class="col-12"><input id="correo" type="email" class="form-control" placeholder="Correo" required></div>
              <div class="col-12"><input id="password" type="password" class="form-control" placeholder="Contraseña" required></div>
              <div class="col-12"><button type="submit" class="btn btn-primary">Crear usuario</button></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Accesos rápidos -->
    <h2 class="h5 mt-4 mb-3">2. ¿Qué quieres hacer?</h2>
    <div class="row g-3">
      <div class="col-6 col-md-3"><a href="registros.html" class="btn btn-outline-primary w-100 py-3">Registros</a></div>
      <div class="col-6 col-md-3"><a href="presupuestos.html" class="btn btn-outline-primary w-100 py-3">Presupuestos</a></div>
      <div class="col-6 col-md-3"><a href="metas.html" class="btn btn-outline-primary w-100 py-3">Metas de ahorro</a></div>
      <div class="col-6 col-md-3"><a href="recurrentes.html" class="btn btn-outline-primary w-100 py-3">Recurrentes</a></div>
      <div class="col-6 col-md-3"><a href="categorias.html" class="btn btn-outline-secondary w-100 py-3">Categorías</a></div>
      <div class="col-6 col-md-3"><a href="etiquetas.html" class="btn btn-outline-secondary w-100 py-3">Etiquetas</a></div>
      <div class="col-6 col-md-3"><a href="inversiones.html" class="btn btn-outline-secondary w-100 py-3">Inversiones</a></div>
      <div class="col-6 col-md-3"><a href="notificaciones.html" class="btn btn-outline-secondary w-100 py-3">Notificaciones</a></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
