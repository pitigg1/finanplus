<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Etiquetas - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link href="css/apple.css?v=20261030d" rel="stylesheet">
  <link href="css/vistas.css?v=20261030d" rel="stylesheet">
  <link href="css/ios.css?v=20261030d" rel="stylesheet">
  <script src="js/tema.js?v=20261030d"></script>
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <div class="page-head">
      <div><h1>Etiquetas</h1><p class="page-sub">Agrupa movimientos de distintas categorías.</p></div>
      <button type="button" class="btn btn-primary btn-nuevo" onclick="nuevoDesdeCabecera()"><i class="bi bi-plus-lg"></i><span>Nueva etiqueta</span></button>
    </div>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nueva etiqueta</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control" maxlength="100" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Etiqueta</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js?v=20261030d"></script>
  <script src="js/etiquetas.js?v=20261030d"></script>
</body>
</html>
