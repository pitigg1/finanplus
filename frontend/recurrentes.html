<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recurrentes - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Movimientos recurrentes</h1>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nuevo movimiento recurrente</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select id="categoria" class="form-select" required></select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Tipo</label>
            <select id="tipo" class="form-select">
              <option>GASTO</option>
              <option>INGRESO</option>
              <option>AHORRO</option>
              <option>INVERSION</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Monto estimado</label>
            <div class="input-group"><span class="input-group-text">$</span><input id="monto" type="text" inputmode="numeric" class="form-control monto" placeholder="0" required></div>
          </div>
          <div class="col-md-2">
            <label class="form-label">Frecuencia</label>
            <select id="frecuencia" class="form-select">
              <option>MENSUAL</option>
              <option>SEMANAL</option>
              <option>DIARIA</option>
              <option>ANUAL</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Próxima fecha</label>
            <input id="fecha" type="date" class="form-control" required>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input id="activo" type="checkbox" class="form-check-input" checked>
              <label for="activo" class="form-check-label">Activo</label>
            </div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Categoría</th><th>Tipo</th><th class="text-end">Monto</th><th>Frecuencia</th><th>Próxima fecha</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/recurrentes.js"></script>
</body>
</html>
