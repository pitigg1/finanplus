<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <div class="text-center mb-4">
      <h1 class="h3 mb-1">FinanPlus</h1>
      <p class="text-muted">Inicia sesión o crea una cuenta para acceder a tu plataforma financiera</p>
    </div>

    <div id="alerta"></div>

    <div class="row g-4 justify-content-center">
      <!-- Iniciar Sesión -->
      <div class="col-md-6 col-lg-5">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Iniciar Sesión</h2>
            <form id="formLogin" class="row g-3">
              <div class="col-12">
                <label for="correoLogin" class="form-label small text-muted">Correo electrónico</label>
                <input id="correoLogin" type="email" class="form-control" placeholder="correo@ejemplo.com" required>
              </div>
              <div class="col-12">
                <label for="passwordLogin" class="form-label small text-muted">Contraseña</label>
                <input id="passwordLogin" type="password" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Crear cuenta / Registrarse -->
      <div class="col-md-6 col-lg-5">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">¿No tienes cuenta? Regístrate</h2>
            <form id="formRegistro" class="row g-2">
              <div class="col-12">
                <input id="nombreRegistro" type="text" class="form-control" placeholder="Nombre completo" required>
              </div>
              <div class="col-12">
                <input id="correoRegistro" type="email" class="form-control" placeholder="Correo electrónico" required>
              </div>
              <div class="col-12">
                <input id="passwordRegistro" type="password" class="form-control" placeholder="Contraseña (mín. 6 caracteres)" minlength="6" required>
              </div>
              <div class="col-6">
                <input id="monedaRegistro" type="text" class="form-control" placeholder="Moneda" value="COP">
              </div>
              <div class="col-6">
                <input id="paisRegistro" type="text" class="form-control" placeholder="País (opcional)">
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-outline-primary w-100">Crear cuenta</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
