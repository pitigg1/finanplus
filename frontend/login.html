<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iniciar Sesión - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link href="css/apple.css?v=20261030b" rel="stylesheet">
  <link href="css/vistas.css?v=20261030b" rel="stylesheet">
  <link href="css/ios.css?v=20261030b" rel="stylesheet">
  <script src="js/tema.js?v=20261030b"></script>
</head>
<body>
  <button class="btn-tema btn-tema-flotante" type="button" onclick="alternarTema()" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
    <i class="bi bi-moon-stars i-luna"></i><i class="bi bi-sun i-sol"></i>
  </button>
  <main class="container py-4">
    <div class="login-wrap">
      <div class="text-center mb-4">
        <div class="login-logo"><i class="bi bi-wallet2"></i></div>
        <h1 class="mb-1">FinanPlus</h1>
        <p class="text-muted mb-0">Entiende en qué se va tu dinero.</p>
      </div>

      <div id="alerta"></div>

      <div class="card">
        <div class="card-body p-4">
          <div class="segmented" role="tablist" aria-label="Acceso">
            <button type="button" id="tabLogin" class="activo" role="tab" aria-selected="true">Iniciar sesión</button>
            <button type="button" id="tabRegistro" role="tab" aria-selected="false">Crear cuenta</button>
          </div>

          <!-- Iniciar sesión -->
          <form id="formLogin" class="row g-3">
            <div class="col-12">
              <label for="correoLogin" class="form-label">Correo electrónico</label>
              <input id="correoLogin" type="email" class="form-control" placeholder="correo@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="col-12">
              <label for="passwordLogin" class="form-label">Contraseña</label>
              <input id="passwordLogin" type="password" class="form-control" placeholder="Tu contraseña" autocomplete="current-password" required>
            </div>
            <div class="col-12 pt-2">
              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </div>
          </form>

          <!-- Crear cuenta -->
          <form id="formRegistro" class="row g-3 d-none">
            <div class="col-12">
              <label for="nombreRegistro" class="form-label">Nombre completo</label>
              <input id="nombreRegistro" type="text" class="form-control" autocomplete="name" required>
            </div>
            <div class="col-12">
              <label for="correoRegistro" class="form-label">Correo electrónico</label>
              <input id="correoRegistro" type="email" class="form-control" placeholder="correo@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="col-12">
              <label for="passwordRegistro" class="form-label">Contraseña</label>
              <input id="passwordRegistro" type="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="col-6">
              <label for="monedaRegistro" class="form-label">Moneda</label>
              <input id="monedaRegistro" type="text" class="form-control" value="COP">
            </div>
            <div class="col-6">
              <label for="paisRegistro" class="form-label">País <span class="fw-normal">(opcional)</span></label>
              <input id="paisRegistro" type="text" class="form-control">
            </div>
            <div class="col-12 pt-2">
              <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js?v=20261030b"></script>
  <script src="js/login.js?v=20261030b"></script>
  <script>
    // Selector tipo iOS: alterna entre iniciar sesión y crear cuenta
    (function () {
      const tabs = { tabLogin: "formLogin", tabRegistro: "formRegistro" };
      Object.keys(tabs).forEach((idTab) => {
        document.getElementById(idTab).addEventListener("click", () => {
          Object.keys(tabs).forEach((otro) => {
            const activo = otro === idTab;
            const boton = document.getElementById(otro);
            boton.classList.toggle("activo", activo);
            boton.setAttribute("aria-selected", activo);
            document.getElementById(tabs[otro]).classList.toggle("d-none", !activo);
          });
        });
      });
    })();
  </script>
</body>
</html>
