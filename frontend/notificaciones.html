<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificaciones - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-1">Notificaciones</h1>
    <p class="text-muted">Alertas sobre tus gastos, presupuestos y metas.</p>
    <div id="alerta"></div>

    <div class="card">
      <div class="card-body table-responsive">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-muted" id="resumen"></span>
          <button class="btn btn-sm btn-primary" onclick="marcarTodas()">Marcar todas como leídas</button>
        </div>
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Estado</th><th>Notificación</th><th>Tipo</th><th>Prioridad</th><th>Fecha</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/notificaciones.js"></script>
</body>
</html>
