<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Categorías - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link href="css/apple.css?v=20261030b" rel="stylesheet">
  <link href="css/vistas.css?v=20261030b" rel="stylesheet">
  <link href="css/ios.css?v=20261030b" rel="stylesheet">
  <script src="js/tema.js?v=20261030b"></script>
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <div class="page-head">
      <div><h1>Categorías</h1><p class="page-sub">Organiza tus movimientos por tipo.</p></div>
      <button type="button" class="btn btn-primary btn-nuevo" onclick="nuevoDesdeCabecera()"><i class="bi bi-plus-lg"></i><span>Nueva categoría</span></button>
    </div>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nueva categoría</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Tipo</label>
            <select id="tipo" class="form-select">
              <option>GASTO</option>
              <option>INGRESO</option>
              <option>AHORRO</option>
              <option>INVERSION</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="form-label">Color</label>
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <input id="color" type="color" class="form-control form-control-color" value="#0d6efd" title="Elige cualquier color">
              <div id="paleta" class="d-flex gap-1 flex-wrap"></div>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Icono: <span id="iconoElegido" class="fs-4 align-middle">—</span></label>
            <input type="hidden" id="icono">
            <div id="iconos" class="d-flex flex-wrap gap-1"></div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Categoría</th><th>Tipo</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js?v=20261030b"></script>
  <script src="js/categorias.js?v=20261030b"></script>
</body>
</html>
