<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inversiones - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link href="css/apple.css?v=20261030b" rel="stylesheet">
  <link href="css/vistas.css?v=20261030b" rel="stylesheet">
  <link href="css/ios.css?v=20261030b" rel="stylesheet">
  <script src="js/tema.js?v=20261030b"></script>
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <div class="page-head">
      <div><h1>Inversiones</h1><p class="page-sub">CDT, acciones, fondos y más.</p></div>
      <button type="button" class="btn btn-primary btn-nuevo" onclick="nuevoDesdeCabecera()"><i class="bi bi-plus-lg"></i><span>Nueva inversión</span></button>
    </div>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nueva inversión</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Activo</label>
            <input id="nombreActivo" class="form-control" placeholder="Ej. CDT Bancolombia" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Tipo</label>
            <select id="tipoActivo" class="form-select">
              <option>ACCION</option>
              <option>ETF</option>
              <option>CRIPTO</option>
              <option>FONDO</option>
              <option>CDT</option>
              <option>BONO</option>
              <option>OTRO</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Monto invertido</label>
            <div class="input-group"><span class="input-group-text">$</span><input id="montoInvertido" type="text" inputmode="numeric" class="form-control monto" placeholder="0" required></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Valor actual</label>
            <div class="input-group"><span class="input-group-text">$</span><input id="valorActual" type="text" inputmode="numeric" class="form-control monto" placeholder="0" required></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Rentabilidad (%)</label>
            <input id="rentabilidad" type="number" step="any" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Riesgo</label>
            <select id="riesgo" class="form-select">
              <option>MEDIO</option>
              <option>BAJO</option>
              <option>ALTO</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Fecha de inversión</label>
            <input id="fechaInversion" type="date" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body table-responsive">
        <p class="text-muted" id="resumen"></p>
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Activo</th><th>Tipo</th><th class="text-end">Invertido</th><th class="text-end">Valor actual</th><th class="text-end">Rentab.</th><th>Riesgo</th><th>Fecha</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js?v=20261030b"></script>
  <script src="js/inversiones.js?v=20261030b"></script>
</body>
</html>
