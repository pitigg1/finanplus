<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inversiones - FinanPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="menu"></div>

  <main class="container py-4">
    <h1 class="h3 mb-3">Inversiones</h1>
    <div id="alerta"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="tituloForm">Nueva inversión</h2>
        <form id="formulario" class="row g-3">
          <input type="hidden" id="id">
          <div class="col-md-4">
            <label class="form-label">Activo</label>
            <input id="nombreActivo" class="form-control" placeholder="Ej. CDT Bancolombia" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Tipo</label>
            <select id="tipoActivo" class="form-select">
              <option>ACCION</option>
              <option>ETF</option>
              <option>CRIPTO</option>
              <option>FONDO</option>
              <option>CDT</option>
              <option>BONO</option>
              <option>OTRO</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Monto invertido</label>
            <input id="montoInvertido" type="number" min="0" step="any" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Valor actual</label>
            <input id="valorActual" type="number" min="0" step="any" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Rentabilidad (%)</label>
            <input id="rentabilidad" type="number" step="any" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Riesgo</label>
            <select id="riesgo" class="form-select">
              <option>MEDIO</option>
              <option>BAJO</option>
              <option>ALTO</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Fecha de inversión</label>
            <input id="fechaInversion" type="date" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="limpiar()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body table-responsive">
        <p class="text-muted" id="resumen"></p>
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Activo</th><th>Tipo</th><th class="text-end">Invertido</th><th class="text-end">Valor actual</th><th class="text-end">Rentab.</th><th>Riesgo</th><th>Fecha</th><th class="text-end">Acciones</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/inversiones.js"></script>
</body>
</html>
