# Configuración SOLO para las pruebas automáticas: base H2 en memoria, sin MySQL.
spring.application.name=FinanPlusPruebas
spring.datasource.url=jdbc:h2:mem:finanplus_pruebas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.time-zone=America/Bogota

# Cuentas y seguridad
finanplus.admin.correo=admin@finanplus.test
finanplus.frontend.url=http://127.0.0.1:5500

# Las fotos de las pruebas van a una carpeta que se borra con 'mvn clean'
finanplus.uploads.dir=target/uploads-pruebas
