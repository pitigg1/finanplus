spring.application.name=FinanPlusApplication
spring.datasource.url=jdbc:mysql://localhost:3306/finanplus?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ADMIN
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO
server.port = 8094

# ---------- Cuentas y seguridad (se pueden cambiar con variables de entorno) ----------
# Correo del primer administrador: quien se registre con este correo (o ya lo tenga) será ADMIN.
finanplus.admin.correo=${FINANPLUS_ADMIN_CORREO:}
# Dirección del frontend; se usa para armar el enlace del correo de recuperar contraseña.
finanplus.frontend.url=${FINANPLUS_FRONTEND_URL:http://127.0.0.1:3000}
# Correo para recuperar contraseña (opcional). Si no se configura, el enlace sale en la consola del backend.
# Para activarlo, define estas variables de entorno antes de arrancar (ejemplo con Gmail y contraseña de aplicación):
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587  SPRING_MAIL_USERNAME=tucorreo@gmail.com
#   SPRING_MAIL_PASSWORD=<contraseña de aplicación>  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true

# ---------- Foto de perfil ----------
# Las fotos se guardan como archivos en esta carpeta del servidor (no en la base de datos).
finanplus.uploads.dir=${FINANPLUS_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
